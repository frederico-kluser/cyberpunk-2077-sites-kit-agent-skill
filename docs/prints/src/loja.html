<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>print · loja · tema street</title>
    <!-- Captura de documentação: classes emitidas por Header, Banner, Section, Grid,
         ProductCard e Footer do netkit-web. Arte: scripts/prints.py. -->
    <link rel="stylesheet" href="../../../assets/netkit-web/netkit-web.css" />
    <link rel="stylesheet" href="_print.css" />
  </head>
  <body>
    <div class="nk-site nk-theme-street">
      <main class="nk-page">
        <div
          class="nk-page-inner"
          style="padding: calc(var(--nk-u) * 120) calc(var(--nk-u) * 200) calc(var(--nk-u) * 120) calc(var(--nk-u) * 160)"
        >
          <header class="nk-header">
            <div class="nk-header-row">
              <div class="nk-header-titles">
                <span
                  class="nk-text"
                  style="--nk-size:110;--nk-font:var(--nk-heading-font);--nk-weight:var(--nk-heading-weight);--nk-color:var(--nk-heading-color);--nk-transform:var(--nk-heading-transform)"
                  >GARAGEM KABUKI</span
                >
                <span class="nk-text" style="--nk-size:44;--nk-color:var(--nk-muted)">Peças originais e o resto</span>
              </div>
            </div>
            <nav class="nk-nav" style="--nk-gap: calc(var(--nk-u) * 64)" aria-label="Navegação do site">
              <a class="nk-nav-item nk-link" href="#">
                <span
                  class="nk-text"
                  style="--nk-size:44;--nk-weight:var(--nk-w-semibold);--nk-transform:uppercase;--nk-color:var(--nk-accent)"
                  >LOJA</span
                >
                <span class="nk-nav-mark" style="--nk-mark: var(--nk-accent)"></span>
              </a>
              <a class="nk-nav-item nk-link" href="#">
                <span class="nk-text" style="--nk-size:44;--nk-weight:var(--nk-w-semibold);--nk-transform:uppercase"
                  >TABELA</span
                >
                <span class="nk-nav-mark"></span>
              </a>
              <a class="nk-nav-item nk-link" href="#">
                <span class="nk-text" style="--nk-size:44;--nk-weight:var(--nk-w-semibold);--nk-transform:uppercase"
                  >OFICINA</span
                >
                <span class="nk-nav-mark"></span>
              </a>
            </nav>
            <span class="nk-divider" style="--nk-thickness: calc(var(--nk-u) * 4)"></span>
          </header>

          <aside class="nk-banner" style="height: calc(var(--nk-u) * 300)">
            <div class="nk-imgbox" style="height: calc(var(--nk-u) * 300); align-self: stretch">
              <img src="art/bar.jpg" alt="" />
            </div>
            <div class="nk-banner-body">
              <span
                class="nk-text"
                style="--nk-size:80;--nk-weight:var(--nk-w-bold);--nk-transform:uppercase;--nk-color:#ffffff"
                >Semana do cromo — 20% em tudo</span
              >
            </div>
          </aside>

          <section class="nk-section">
            <div class="nk-section-head">
              <span class="nk-section-bar"></span>
              <span
                class="nk-text"
                style="--nk-size:72;--nk-font:var(--nk-heading-font);--nk-weight:var(--nk-heading-weight);--nk-color:var(--nk-heading-color);--nk-transform:var(--nk-heading-transform)"
                >Mais vendidos</span
              >
            </div>
            <div class="nk-grid" style="--nk-cols: 3">
              <article class="nk-product" style="width: calc(var(--nk-u) * 860); border: calc(var(--nk-u) * 3) solid var(--nk-line)">
                <div class="nk-imgbox" style="width: calc(var(--nk-u) * 860); height: calc(var(--nk-u) * 860)">
                  <img src="art/jaqueta.jpg" alt="" />
                </div>
                <div class="nk-product-body">
                  <span
                    class="nk-text"
                    style="--nk-size:50;--nk-weight:var(--nk-w-bold);--nk-color:var(--nk-on-surface);--nk-wrap-mode:normal;max-width:calc(var(--nk-u) * 780)"
                    >Jaqueta Samurai</span
                  >
                  <div class="nk-row" style="--nk-gap: calc(var(--nk-u) * 18); align-items: center">
                    <span class="nk-text" style="--nk-size:58;--nk-weight:var(--nk-w-bold);--nk-color:var(--nk-accent)">1 250</span>
                    <span class="nk-text" style="--nk-size:36;--nk-transform:uppercase;--nk-color:var(--nk-muted)">eddies</span>
                  </div>
                  <a class="nk-btn nk-link" href="#" style="--nk-bg-color: var(--nk-accent)">
                    <span
                      class="nk-text"
                      style="--nk-size:40;--nk-weight:var(--nk-w-bold);--nk-transform:uppercase;--nk-color:var(--nk-on-accent)"
                      >COMPRAR</span
                    >
                  </a>
                </div>
              </article>

              <article class="nk-product" style="width: calc(var(--nk-u) * 860); border: calc(var(--nk-u) * 3) solid var(--nk-line)">
                <div class="nk-imgbox" style="width: calc(var(--nk-u) * 860); height: calc(var(--nk-u) * 860)">
                  <img src="art/chip.jpg" alt="" />
                </div>
                <div class="nk-product-body">
                  <span
                    class="nk-text"
                    style="--nk-size:50;--nk-weight:var(--nk-w-bold);--nk-color:var(--nk-on-surface);--nk-wrap-mode:normal;max-width:calc(var(--nk-u) * 780)"
                    >Chip de refrigeração</span
                  >
                  <div class="nk-row" style="--nk-gap: calc(var(--nk-u) * 18); align-items: center">
                    <span class="nk-text" style="--nk-size:58;--nk-weight:var(--nk-w-bold);--nk-color:var(--nk-accent)">340</span>
                    <span class="nk-text" style="--nk-size:36;--nk-transform:uppercase;--nk-color:var(--nk-muted)">eddies</span>
                  </div>
                  <a class="nk-btn nk-link" href="#" style="--nk-bg-color: var(--nk-accent)">
                    <span
                      class="nk-text"
                      style="--nk-size:40;--nk-weight:var(--nk-w-bold);--nk-transform:uppercase;--nk-color:var(--nk-on-accent)"
                      >COMPRAR</span
                    >
                  </a>
                </div>
              </article>

              <article class="nk-product" style="width: calc(var(--nk-u) * 860); border: calc(var(--nk-u) * 3) solid var(--nk-line)">
                <div class="nk-imgbox" style="width: calc(var(--nk-u) * 860); height: calc(var(--nk-u) * 860)">
                  <img src="art/oculos.jpg" alt="" />
                </div>
                <div class="nk-product-body">
                  <span
                    class="nk-text"
                    style="--nk-size:50;--nk-weight:var(--nk-w-bold);--nk-color:var(--nk-on-surface);--nk-wrap-mode:normal;max-width:calc(var(--nk-u) * 780)"
                    >Óculos anti-flash</span
                  >
                  <div class="nk-row" style="--nk-gap: calc(var(--nk-u) * 18); align-items: center">
                    <span class="nk-text" style="--nk-size:58;--nk-weight:var(--nk-w-bold);--nk-color:var(--nk-accent)">780</span>
                    <span class="nk-text" style="--nk-size:36;--nk-transform:uppercase;--nk-color:var(--nk-muted)">eddies</span>
                  </div>
                  <a class="nk-btn nk-link" href="#" style="--nk-bg-color: var(--nk-accent)">
                    <span
                      class="nk-text"
                      style="--nk-size:40;--nk-weight:var(--nk-w-bold);--nk-transform:uppercase;--nk-color:var(--nk-on-accent)"
                      >COMPRAR</span
                    >
                  </a>
                </div>
              </article>
            </div>
          </section>

          <footer class="nk-footer">
            <span class="nk-divider" style="--nk-thickness: calc(var(--nk-u) * 3)"></span>
            <div class="nk-footer-row">
              <span class="nk-text" style="--nk-size:36;--nk-color:var(--nk-muted)">© 2077 Garagem Kabuki</span>
              <span class="nk-sp" style="flex-grow: 1"></span>
              <a class="nk-text nk-link" href="#" style="--nk-size:36;--nk-transform:uppercase;--nk-weight:var(--nk-w-semibold);--nk-color:var(--nk-link)">TABELA</a>
            </div>
          </footer>
        </div>
      </main>
    </div>
  </body>
</html>
