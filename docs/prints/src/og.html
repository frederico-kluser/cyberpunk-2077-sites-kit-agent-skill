<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>netkit-web · capa do repositório</title>
    <!-- Imagem de capa (og.png): tipografia do kit + as cinco cores de acento. -->
    <link rel="stylesheet" href="../../../assets/netkit-web/netkit-web.css" />
    <link rel="stylesheet" href="_print.css" />
  </head>
  <body>
    <div class="nk-site nk-theme-net">
      <main class="nk-page">
        <div
          class="nk-page-inner"
          style="padding: calc(var(--nk-u) * 150) calc(var(--nk-u) * 200) calc(var(--nk-u) * 120) calc(var(--nk-u) * 160); gap: calc(var(--nk-u) * 34); justify-content: center"
        >
          <span class="nk-text" style="--nk-size:38;--nk-transform:uppercase;--nk-weight:var(--nk-w-semibold);--nk-color:var(--nk-muted)"
            >Cyberpunk 2077 · mod NetSites · frontend</span
          >
          <span
            class="nk-text"
            style="--nk-size:210;--nk-font:var(--nk-font-orbitron);--nk-weight:var(--nk-w-black);--nk-color:var(--nk-accent);--nk-transform:uppercase"
            >NETKIT/WEB</span
          >
          <span
            class="nk-text"
            style="--nk-size:60;--nk-color:var(--nk-text-color);--nk-wrap-mode:normal;max-width:calc(var(--nk-u) * 2400)"
            >Sites no padrão visual do mod NetSites — sistema fechado, pronto a injetar.</span
          >
          <span class="nk-divider" style="--nk-thickness: calc(var(--nk-u) * 4)"></span>
          <div class="nk-row" style="--nk-gap: calc(var(--nk-u) * 20); align-items: stretch">
            <span class="nk-rect" style="--nk-bg-color:#5ef6ff;width:calc(var(--nk-u) * 150);height:calc(var(--nk-u) * 22)"></span>
            <span class="nk-rect" style="--nk-bg-color:#e0312b;width:calc(var(--nk-u) * 150);height:calc(var(--nk-u) * 22)"></span>
            <span class="nk-rect" style="--nk-bg-color:#f3e600;width:calc(var(--nk-u) * 150);height:calc(var(--nk-u) * 22)"></span>
            <span class="nk-rect" style="--nk-bg-color:#c8102e;width:calc(var(--nk-u) * 150);height:calc(var(--nk-u) * 22)"></span>
            <span class="nk-rect" style="--nk-bg-color:#ff2fd0;width:calc(var(--nk-u) * 150);height:calc(var(--nk-u) * 22)"></span>
            <span class="nk-sp" style="flex-grow:1"></span>
            <span class="nk-text" style="--nk-size:36;--nk-transform:uppercase;--nk-weight:var(--nk-w-semibold);--nk-color:var(--nk-muted)"
              >25 componentes · 5 temas · 44 testes</span
            >
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
